[project]
name = "sglang-ops-stack"
version = "0.1.0"
description = "SGLang operations stack MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sglang_ops_stack = ["web/templates/**/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true
