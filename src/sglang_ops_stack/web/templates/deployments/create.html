{% extends "base.html" %}
{% block title %}New Deployment · sglang_ops_stack{% endblock %}
{% block content %}
<section>
  <h2>Create SGLang Deployment</h2>
  <form method="post" action="/deployments">
    <label>Host
      <select name="host_id" required>
        {% for host in hosts %}<option value="{{ host.id }}">{{ host.name }} ({{ host.ip }})</option>{% endfor %}
      </select>
    </label>
    <label>Name <input name="name" required></label>
    <label>Container name <input name="container_name" required pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]+"></label>
    <label>Image <input name="image" required placeholder="lmsysorg/sglang:latest"></label>
    <label>Model path <input name="model_path" required placeholder="/models/model-name"></label>
    <label>Served model name <input name="served_model_name"></label>
    <label>Port <input name="port" type="number" min="1" max="65535" value="30000" required></label>
    <button type="submit">Create</button>
  </form>
</section>
{% endblock %}
